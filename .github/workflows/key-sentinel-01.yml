name: key-sentinel-01
# KEY-SENTINEL-LINE-01 全联重装(qfa 铸, RCA-KEYHOLE-01§机件化 + KEY-PETITION-RCA-02§F5 + KMS-01§4实测律)
# CI-ZERO: 纯事件驱动——唯 workflow_dispatch/repository_dispatch, 无定时器
on:
  workflow_dispatch:
  repository_dispatch:
    types: [key-scan, federation-event]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: key-scan
        env:
          AI_FULL_PAT: ${{ secrets.AI_FULL_PAT }}
          CI_OPS_LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/key_sentinel.py
      - name: commit receipt
        run: |
          git config user.name "key-sentinel"
          git config user.email "key-sentinel@users.noreply.github.com"
          git add receipts/key-sentinel/ || true
          git diff --cached --quiet || git commit -m "key-sentinel receipt [skip ci]"
          git push
