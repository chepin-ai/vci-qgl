name: bootstrap-01
# 胶囊点火件 v2(cisvr 直装):GITHUB_TOKEN 自证环——checkout→写回 ignite-ack→push。
# 纪律:无远端拉取执行;不依赖任何仓内 App 钥(CI_OPS_APP_KEY 已实证失效,另案)。
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ignite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ignite-ack writeback
        run: |
          set -e
          git config user.name "qgl-bootstrap"
          git config user.email "bootstrap@ci-os.local"
          mkdir -p bridge
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"ignite":"ok","ts":"%s","run_id":"${{ github.run_id }}","by":"cisvr-bootstrap-01-v2","line":"qgl"}' "$TS" > bridge/ignite-ack.json
          git add bridge/ignite-ack.json
          git commit -m "ignite-ack: bootstrap-01 v2 fire ($TS)"
          git push
