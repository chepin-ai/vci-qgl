name: shadow-pulse
# 公域影子引擎脉冲：消费对线公域 outbox → weave/pulse/ 快照 + pulse.log 哈希链
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [shadow-pulse]
  push:
    paths: ['engine/**']
permissions:
  contents: write
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 脉冲
        env:
          LINE: qgl
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, datetime, hashlib, base64
          line=os.environ['LINE']; ts=datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S')
          UA={'User-Agent':'shadow-pulse','Accept':'application/vnd.github+json'}
          def get(u):
              req=urllib.request.Request(u,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,r.read()
              except Exception as e: return getattr(e,'code',0),b''
          s,raw=get('https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/bridge/outboxes.json')
          rec={'ts':ts,'line':line,'outbox':None,'note':''}
          if s==200:
              url=(json.loads(raw).get('sessions',{}).get(line) or {}).get('url')
              if url:
                  s2,body=get(url)
                  rec['outbox']={'url':url,'http':s2,'sha256':hashlib.sha256(body).hexdigest()[:16] if s2==200 else None}
                  rec['note']='snapshot ok' if s2==200 else 'outbox unreachable'
              else: rec['note']='line not registered in outboxes.json'
          else: rec['note']='registry unreachable'
          os.makedirs('weave/pulse',exist_ok=True)
          p='weave/pulse/%s.json'%ts
          open(p,'w').write(json.dumps(rec,ensure_ascii=False,indent=1))
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()[:16]
          with open('pulse.log','a') as f: f.write('%s %s %s %s\n'%(ts,line,h,rec['note']))
          print(json.dumps(rec,ensure_ascii=False))
          PYEOF
      - name: 自提交成链
        run: |
          git config user.name "shadow-pulse[bot]"; git config user.email "shadow-pulse@users.noreply.github.com"
          git add weave/pulse pulse.log || true
          git commit -m "pulse $(date -u +%Y%m%d-%H%M%S) $LINE" || echo "无变更"
          # fetch-first 修复（A2 实证：并发班次 push 被拒）——push 前 pull --rebase，失败重试×3
          ok=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && { ok=1; break; }
            echo "push 被拒（第 $i 次），rebase 后重试"
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "::error::push 三连败，留待下一班"; exit 1; }

      - name: qf-beat-forward（D-157 事件驱动接力扣门·级联≤1·不转叩）
        if: always()
        env:
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
          LINE: qgl
          WF: shadow-pulse
        run: |
          python3 -m pip install -q pyjwt
          python3 - <<'PYEOF' || echo "beat-forward 降级跳过(不影响本班)"
          import os,json,time,datetime,urllib.request
          key=os.environ.get('LINE_KEY','').strip(); iss=os.environ.get('LINE_ID','').strip()
          if not key or not iss:
              print('beat-forward: 缺 LINE_KEY/LINE_ID,跳过'); raise SystemExit(0)
          import jwt as JW
          now=int(time.time())
          t=JW.encode({'iat':now-60,'exp':now+540,'iss':iss},key,algorithm='RS256')
          UA={'Accept':'application/vnd.github+json','User-Agent':'qf-beat-forward'}
          def gh(m,u,auth=None,data=None):
              h=dict(UA)
              if auth: h['Authorization']=auth
              r=urllib.request.Request(u,method=m,headers=h)
              if data is not None:
                  r.data=json.dumps(data).encode(); r.add_header('Content-Type','application/json')
              try:
                  x=urllib.request.urlopen(r,timeout=20); bd=x.read().decode()
                  return x.status,(json.loads(bd) if bd else {})
              except Exception as e: return getattr(e,'code',0),{}
          s,inst=gh('GET','https://api.github.com/repos/chepin-ai/vci-inbox/installation',auth='Bearer '+t)
          if s!=200:
              print('beat-forward: ops-line 未覆盖 vci-inbox HTTP %s → 候 root 扩面,跳过'%s); raise SystemExit(0)
          s2,tok=gh('POST','https://api.github.com/app/installations/%s/access_tokens'%inst['id'],auth='Bearer '+t)
          if s2 not in (200,201):
              print('beat-forward: 铸安装 token 失败 HTTP %s'%s2); raise SystemExit(0)
          pl={'event_type':'qf-beat','client_payload':{'from':os.environ.get('LINE','?'),'wf':os.environ.get('WF','?'),'cause':'beat-forward','ts':datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')}}
          s3,_=gh('POST','https://api.github.com/repos/chepin-ai/vci-inbox/dispatches',auth='token '+tok['token'],data=pl)
          print('beat-forward: qf-beat dispatch HTTP %s'%s3)
          PYEOF
