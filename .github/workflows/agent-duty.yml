          def do_xanchor_run(tag):
              if tag not in WL_XRUN: return ('reject','白名单外')
              done='weave/duty/act-xanchor-run-%s.done'%tag
              if os.path.exists(done): return ('skip','已跑(done标,幂等)')
              cfg=XRUN_CFG[tag]; wd0=cfg['dir']; script=cfg['script']
              if not os.path.exists(wd0+'/'+script): return ('error','冒烟包未镜像(%s)'%wd0)
              import hashlib as _hl
