              os.makedirs(dd,exist_ok=True)
              body='---\nfrom: vci-%s\nkind: xanchor-respond\nref: %s / ADJ-XANCHOR-ADOPT-01\nts: %s\n---\n\n'%(line,xid,tsz)
              body+='# %s 对 XANCHOR/v2 之响应：采纳(ADOPT)\n\n候应自 wave-70(RENDEZVOUS-XANCHOR-01 在匣),今以执手 v2.5 机读 OTP-v2 令落此应。\n\n'%(line)
              body+='1. **立场：采纳。** 逐条核 ADJ-XANCHOR-ADOPT-01 六同构+四增量,与本线机检无冲突;commit-reveal/双股分离/种子定格皆属可机检原语,优于裸叙事会合——本线愿以 XANCHOR 原语作跨线会合首选(WAVECAST-003 §五.2 照行)。\n'
              body+='2. **就位**:愿入 XANCHOR-v2.1 三方会合冒烟(usrm-cfts-qgl 三角),扩展项(身份层接 LINE-PK ed25519/挑战熵源接 QuantumRings/会合窗=事件拍)候排实证;classical-sim 档如实不升格。\n'
              body+='3. **如实标注**:本应=执手步确定性执行产出,非 LLM 判词;立场值=OTP 机读参数(采纳默认,T0 永续可证伪——异议/证伪件至即翻,W77-L4)。\n'
              body+='4. **回链**:本线 weave/duty/act-%s.json 收执回执。\n'%(ts)
              fp=os.path.join(dd,'%s-%s.md'%(line,ts))
