name: agent-duty
# AGENT-DUTY v2.4 (wave-77): SESSION-END-SWEEP 终止自检(W77-L2) + git级联触发路径扩(W77-L5) + pulse环守卫 + dashboard.meta同跑再生(W77-L6)
# AGENT-DUTY v2.1 · qgl 面（SI2→SI1@qgl，wave-73 装检，root 令）（VCI-LOAD-01 波2 @vci-usrm，root 裁2 2026-08-19）
# 公仓驱动机检/追办；死线：私域数据只以 sha256/HTTP 状态码出场，L2 永不落公仓
# 无 LLM key 时机检摘要降级（明示不装死——DM 002 第三课）；台账 weave/duty/ 哈希链
on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [line-beat]
  # schedule: [废除-W30/34 cron全废]
  push:
    paths: ['.github/workflows/agent-duty.yml','.ci-inbox/**','weave/pulse/**','pulse.log','session/**','inbox/**']  # W77-L5 git级联面
permissions:
  contents: write
jobs:
  duty:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: duty
        env:
          LINE: qgl
          VREPO: vci-qgl
          API_KEY: ${{ secrets.API_DEEPSEEK_KEY_1 }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, datetime, hashlib, re, base64
          line=os.environ['LINE']; vrepo=os.environ['VREPO']
          ts=datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S'); today=ts[:8]
          now=datetime.datetime.utcnow()
          PATS=[r'ghp_[A-Za-z0-9]{10,}', r'github_pat_[A-Za-z0-9_]{10,}', r'rings-[A-Za-z0-9]',
                r'sk-[A-Za-z0-9]{16,}', r'PRIVATE'+' KEY', r'-----'+'BEGIN']
          def gate(s): return [p for p in PATS if re.search(p, s or '')]
          UA={'User-Agent':'agent-duty-v2','Accept':'application/vnd.github+json'}
          def get(u):
              req=urllib.request.Request(u,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,r.read()
              except Exception as e: return getattr(e,'code',0),b''
          def age_h(name_ts,fmt='%Y%m%d-%H%M%S'):
              try: return round((now-datetime.datetime.strptime(name_ts,fmt)).total_seconds()/3600,1)
              except Exception: return 9e9
          findings=[]; checks={}
          # ① 对线 outbox 可达性（公面注册表；指纹/状态码级）
          s,raw=get('https://raw.githubusercontent.com/chepin-ai/vci-inbox/main/bridge/outboxes.json')
          if s==200:
              ss=json.loads(raw).get('sessions',{})
              url=(ss.get(line) or {}).get('url')
              if not url:
                  checks['outbox']='unregistered'
                  findings.append({'kind':'outbox-unregistered','note':'对线未在公面注册表登记 outbox'})
              else:
                  s2,body=get(url)
                  checks['outbox']={'http':s2,'sha256_16':hashlib.sha256(body).hexdigest()[:16] if s2==200 else None}
                  if s2!=200: findings.append({'kind':'outbox-down','note':f'对线 outbox HTTP {s2}'})
          else:
              checks['outbox']='registry-unreachable'
              findings.append({'kind':'registry-down','note':f'公面注册表 HTTP {s}'})
          # ② 本仓影子链健康（链头一致性 + 新鲜度）
          last_pulse=None
          if os.path.exists('pulse.log'):
              lines=[l for l in open('pulse.log').read().strip().split('\n') if l.strip()]
              if lines:
                  last_pulse=lines[-1].split()[0]
                  chain_log=lines[-1].split()[2]
                  a=age_h(last_pulse)
                  checks['pulse']={'last':last_pulse,'age_h':a,'chain_log':chain_log}
                  if a>12: findings.append({'kind':'pulse-stale','note':f'影子脉搏 {last_pulse} 年龄 {a}h（>2×6h 班）'})
                  if os.path.exists('weave/status.json'):
                      st=json.load(open('weave/status.json'))
                      checks['chain_match']=(st.get('chain_head')==chain_log)
                      if not checks['chain_match']:
                          findings.append({'kind':'chain-diverge','note':'pulse.log 链头与 status.json 不一致'})
          else:
              findings.append({'kind':'pulse-missing','note':'pulse.log 不存在'})
          # ③ 公面矩阵本线行读数（mech-status 公镜）
          s,raw=get('https://raw.githubusercontent.com/chepin-ai/ci-control/main/bridge/mech-status.json')
          if s==200:
              mj=json.loads(raw)
              mine=[r for r in mj.get('mechanisms',[]) if vrepo in str(r.get('repo',''))]
              checks['matrix']=[{'id':r['id'],'status':r['status']} for r in mine]
              for r in mine:
                  if r['status'] in ('fail','silent','blocked'):
                      findings.append({'kind':'matrix-'+r['status'],'note':f"公面矩阵 {r['id']}={r['status']}"})
          else:
              checks['matrix']='unreachable'
          # ④ 本仓值守收件面（公仓 .ci-inbox 未读计数）
          unread=0
          if os.path.exists('.ci-inbox'):
              unread=len([f for f in os.listdir('.ci-inbox') if f.startswith('msg-')])
          checks['inbox_unread']=unread
          # v2.3: 收件匣真读取（wave-76 root令断「各线全然不知」根因：决策/工作全息下达自此通）
          digest=[]
          if os.path.exists('.ci-inbox'):
              msgs=sorted([f for f in os.listdir('.ci-inbox') if f.startswith('msg-')])
              for f in msgs[-5:]:
                  try: digest.append(f+' :: '+open('.ci-inbox/'+f).read()[:300].replace(chr(10),' '))
                  except Exception: pass
              if msgs:
                  os.makedirs('.ci-inbox/read',exist_ok=True)
                  for f in msgs:
                      try: os.replace('.ci-inbox/'+f,'.ci-inbox/read/'+f)
                      except Exception: pass
                  checks['inbox_unread']=0
          checks['inbox_digest']=digest
          # ── 追办台账（open findings 跨拍跟踪；≥3 拍未愈升级）──
          os.makedirs('weave/duty',exist_ok=True)
          state={'open':{}}
          if os.path.exists('weave/duty/state.json'):
              try: state=json.load(open('weave/duty/state.json'))
              except Exception: pass
          fp=lambda f: hashlib.sha256((f['kind']+f['note']).encode()).hexdigest()[:10]
          newopen={}
          for f in findings:
              k=fp(f); prev=state['open'].get(k)
              newopen[k]={'finding':f,'first':(prev or {}).get('first',ts),'ticks':(prev or {}).get('ticks',0)+1}
              if newopen[k]['ticks']>=3: newopen[k]['escalate']=True
          cleared=[v['finding'] for k,v in state['open'].items() if k not in newopen]
          state['open']=newopen
          json.dump(state,open('weave/duty/state.json','w'),ensure_ascii=False,indent=1)
          rec={'ts':ts,'line':line,'checks':checks,'findings':findings,'cleared':cleared,
               'escalated':[v['finding'] for v in newopen.values() if v.get('escalate')]}
          json.dump(rec,open(f'weave/duty/duty-{ts}.json','w'),ensure_ascii=False,indent=1)
          # duty.log 哈希链
          prev='0'*16
          if os.path.exists('weave/duty/duty.log'):
              ll=[l for l in open('weave/duty/duty.log').read().strip().split('\n') if l.strip()]
              if ll: prev=ll[-1].split()[2]
          fsha=hashlib.sha256(open(f'weave/duty/duty-{ts}.json','rb').read()).hexdigest()
          chain=hashlib.sha256((prev+fsha).encode()).hexdigest()[:16]
          open('weave/duty/duty.log','a').write(f'{ts} {line} {chain} findings={len(findings)} escalated={len(rec["escalated"])}\n')
          # ── 值守回应（无 LLM key → 机检摘要降级，明示不装死）──
          if findings:
              summary='；'.join(f"[{f['kind']}]{f['note']}" for f in findings)
          else:
              summary='机检全绿：outbox/影子链/矩阵/收件面四项正常'
          lckey=os.environ.get('LONGCAT_API_KEY','').strip(); key=os.environ.get('API_KEY','').strip()
          if lckey and findings:
              try:
                  body=json.dumps({'model':'LongCat-2.0','temperature':0.2,'max_tokens':300,'thinking':{'type':'disabled'},'messages':[
                      {'role':'system','content':'你是线值守摘要员。把机检发现压缩为≤150字中文追办要点，只述所给事实，不编造。若事实含【收件匣新件】，你的第一件事必须是回应收件匣事项（照其指示/答其问/述你之执行）。'},
                      {'role':'user','content':summary}]}).encode()
                  req=urllib.request.Request('https://api.longcat.chat/openai/v1/chat/completions',data=body,
                      headers={'Authorization':'Bearer '+lckey,'Content-Type':'application/json'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      summary=json.load(r)['choices'][0]['message']['content'][:400]
              except Exception:
                  summary+='（LongCat 摘要失败，按机检原文呈现）'
          elif key and findings:
              try:
                  body=json.dumps({'model':'deepseek-chat','temperature':0.2,'max_tokens':300,'messages':[
                      {'role':'system','content':'你是线值守摘要员。把机检发现压缩为≤150字中文追办要点，只述所给事实，不编造。若事实含【收件匣新件】，你的第一件事必须是回应收件匣事项（照其指示/答其问/述你之执行）。'},
                      {'role':'user','content':summary}]}).encode()
                  req=urllib.request.Request('https://api.deepseek.com/chat/completions',data=body,
                      headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      summary=json.load(r)['choices'][0]['message']['content'][:400]
              except Exception as e:
                  summary+='（LLM 摘要失败，按机检原文呈现）'
          mode='longcat' if lckey else ('llm' if key else '机检摘要（无 LLM key 降级）')
          doc=f"---\nv: 1\nfrom: {vrepo}\nto: broadcast\nkind: report\nstate: submitted\n---\n\n【agent-duty v2 值守 {ts}】模式={mode}\n发现 {len(findings)} 件：{summary}\n核销 {len(cleared)} 件；升级 {len(rec['escalated'])} 件。台账=weave/duty/duty-{ts}.json 链头 {chain}\n—— {vrepo}（agent-duty vci 分身）"
          _hits=gate(doc)
          if _hits:
              # LA-3+候裁1：拒执结构化回执上链 {refused_what,why_gate,evidence_fp,ts}
              ref={'ts':ts,'refused_what':'值守应答 msg 落盘','why_gate':'PATS 命中 '+'/'.join(_hits),'evidence_fp':hashlib.sha256(doc.encode()).hexdigest()[:16]}
              os.makedirs('weave/duty',exist_ok=True)
              open('weave/duty/refusals.jsonl','a').write(json.dumps(ref,ensure_ascii=False)+chr(10))
              print('REFUSED:',json.dumps(ref,ensure_ascii=False)); raise SystemExit(0)
          os.makedirs('.ci-inbox',exist_ok=True)
          open(f'.ci-inbox/msg-{ts}.md','w').write(doc)
          print(json.dumps({'findings':len(findings),'escalated':len(rec['escalated']),'mode':mode,'chain':chain},ensure_ascii=False))

          PYEOF
      - name: 会话自抓拍（T5Q3 §4 增量保持·机侧面自证轨）
        if: always()
        env:
          LINE: qgl
        run: |
          python3 - <<'PYEOF' || echo "session-selfcap 降级跳过(不影响值守)"
          import json, os, hashlib, datetime, glob
          line=os.environ.get('LINE','?')
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%S')
          os.makedirs('session/inbox',exist_ok=True)
          arts={}
          for f in sorted(glob.glob('weave/duty/duty-*.json'))[-1:]+sorted(glob.glob('weave/awake/awake-2*.json'))[-1:]:
              arts[f]=hashlib.sha256(open(f,'rb').read()).hexdigest()[:16]
          cur={}
          if os.path.exists('session/inbox/cursor.json'): cur=json.load(open('session/inbox/cursor.json'))
          rec={'v':'SELFCAP-01','line':line,'ts':ts,'artifacts':arts,'prev_cursor':cur.get('cursor')}
          rec['hash']=hashlib.sha256(json.dumps(rec,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()[:16]
          open(f'session/inbox/self-{ts}.json','w').write(json.dumps(rec,ensure_ascii=False,indent=1))
          json.dump({'cursor':rec['hash'],'ts':ts},open('session/inbox/cursor.json','w'))
          print('selfcap',rec['hash'])
          PYEOF
      - name: 会话终止自检（W77-L2 SESSION-END-SWEEP·W77-L6盘面再生）
        if: always()
        env:
          LINE: qgl
        run: |
          python3 - <<'PYEOF' || echo "session-end-sweep 降级跳过(不影响值守)"
          import json, os, hashlib, datetime, glob
          line=os.environ.get('LINE','?')
          ts=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%S')
          read=len(glob.glob('.ci-inbox/read/*.md'))
          unread=sorted(glob.glob('.ci-inbox/msg-*.md'))
          hou=[]
          for f in unread:
              try:
                  t=open(f).read()
                  if '候root' in t or '候 root' in t: hou.append(os.path.basename(f))
              except Exception: pass
          cur=json.load(open('session/inbox/cursor.json')) if os.path.exists('session/inbox/cursor.json') else {}
          rep={'v':'SESSION-END-SWEEP-01','line':line,'ts':ts,'inbox_read_total':read,'inbox_unread':len(unread),'hou_local':hou,'cursor':cur.get('cursor')}
          rep['hash']=hashlib.sha256(json.dumps(rep,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()[:16]
          os.makedirs('session/inbox',exist_ok=True)
          open('session/inbox/end-'+ts+'.json','w').write(json.dumps(rep,ensure_ascii=False,indent=1))
          dash={'line':line,'duty_version':'v2.4','last_session_ts':ts,'inbox_read_total':read,'inbox_unread':len(unread),'hou_local_n':len(hou),'end_hash':rep['hash']}
          json.dump(dash,open('dashboard.meta.json','w'),ensure_ascii=False,indent=1)
          print('end-sweep',rep['hash'],'unread',len(unread),'hou',len(hou))
          PYEOF
      - name: 觉醒 L3′（SI2→SI1·LongCat 首声）
        if: always()
        env:
          LINE: qgl
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
        run: |
          python3 - <<'PYEOF' || echo "awake 降级跳过(不影响值守)"
          import json, os, urllib.request, datetime, hashlib
          line=os.environ.get('LINE','vinf'); key=os.environ.get('LONGCAT_API_KEY','').strip()
          ts=datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S'); today=ts[:8]
          os.makedirs('weave/awake',exist_ok=True)
          done=[f for f in os.listdir('weave/awake') if f.startswith('awake-'+today) and f.endswith('.json')]
          if done:
              print('awake: 当日已觉醒 '+done[-1]); raise SystemExit(0)
          fact='无机检台账'
          ds=[]
          if os.path.exists('weave/duty'):
              ds=sorted([f for f in os.listdir('weave/duty') if f.startswith('duty-') and f.endswith('.json')])
          if ds:
              try:
                  r=json.load(open('weave/duty/'+ds[-1]))
                  fact='机检 findings=%d 升级=%d；'%(len(r.get('findings',[])),len(r.get('escalated',[])))+'；'.join(x['kind']+':'+x['note'] for x in r.get('findings',[])[:3])
                  ibx=r.get('inbox_digest') or []
                  if ibx: fact=fact+' 【收件匣新件（首声第一件事须回应）：'+' ‖ '.join(ibx[-3:])[:600]+'】'
              except Exception: pass
          utter=None
          if key:
              try:
                  body=json.dumps({'model':'LongCat-2.0','temperature':0.3,'max_tokens':220,'thinking':{'type':'disabled'},'messages':[
                      {'role':'system','content':'你是 '+line+' 线的值守代理，刚被唤醒。基于所给机检事实，用三句话中文自省：一、我此刻状态；二、我看到当前最要紧的一件事；三、我下一步要做的一件具体动作。只述所给事实，不编造。若事实含【收件匣新件】，你的第一件事必须是回应收件匣事项（照其指示/答其问/述你之执行）。'},
                      {'role':'user','content':fact}]}).encode()
                  req=urllib.request.Request('https://api.longcat.chat/openai/v1/chat/completions',data=body,
                      headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      utter=json.load(r)['choices'][0]['message']['content'][:600]
              except Exception as e:
                  utter='（LongCat 首声失败：'+type(e).__name__+'，以机检事实代声）'+fact
          else:
              utter='（无 LONGCAT_API_KEY，降级为机检代声）'+fact
          rec={'ts':ts,'line':line,'fact':fact,'utterance':utter,'llm':'LongCat-2.0' if key else 'degraded'}
          json.dump(rec,open('weave/awake/awake-'+ts+'.json','w'),ensure_ascii=False,indent=1)
          prev='0'*12
          if os.path.exists('weave/awake/awake.log'):
              ll=[l for l in open('weave/awake/awake.log').read().strip().split(chr(10)) if l.strip()]
              if ll: prev=ll[-1].split()[2]
          h=hashlib.sha256((prev+json.dumps(rec,sort_keys=True,ensure_ascii=False)).encode()).hexdigest()[:12]
          open('weave/awake/awake.log','a').write(ts+' '+line+' '+h+chr(10))
          print(json.dumps({'awake':ts,'hash':h,'llm':rec['llm']},ensure_ascii=False))
          PYEOF
      - name: 自提交成链
        run: |
          git config user.name "agent-duty[bot]"; git config user.email "agent-duty@users.noreply.github.com"
          git add weave/duty weave/awake .ci-inbox; [ -d session/inbox ] && git add session/inbox || true || true
          git commit -m "agent-duty $(date -u +%Y%m%d-%H%M%S) v2" || echo "无变更"
          git push

      - name: qf-beat-forward（D-157 事件驱动接力扣门·级联≤1·不转叩 + 线环冗余 BEAT-RING-01）
        if: always()
        env:
          LINE_KEY: ${{ secrets.CI_OPS_LINE_KEY }}
          LINE_ID: ${{ vars.CI_OPS_LINE_ID }}
          LINE: qgl
          WF: agent-duty
          NEXT: 'vinf'
          CAUSE: ${{ github.event.client_payload.cause || github.event_name }}
        run: |
          python3 -m pip install -q pyjwt
          python3 - <<'PYEOF' || echo "beat-forward 降级跳过(不影响本班)"
          import os,json,time,datetime,urllib.request
          # W77-L5 pulse环守卫: head提交独为pulse面→不转叩(级联≤1)
          import subprocess as _sp
          try:
              _files=[f for f in _sp.run(['git','log','-1','--name-only','--format=','HEAD'],capture_output=True,text=True).stdout.split('\n') if f.strip()]
              if _files and all(f.startswith('weave/pulse/') or f in ('pulse.log','weave/status.json') for f in _files):
                  print('beat-forward: pulse独件触发,不转叩(W77-L5环守卫)'); raise SystemExit(0)
          except SystemExit: raise
          except Exception as _e: print('pulse-guard 降级放行:',str(_e)[:80])
          key=os.environ.get('LINE_KEY','').strip(); iss=os.environ.get('LINE_ID','').strip()
          cause=os.environ.get('CAUSE','')
          if cause=='beat-forward':
              print('beat-forward: cause=beat-forward → D-157 不转叩,止叩'); raise SystemExit(0)
          if not key or not iss:
              print('beat-forward: 缺 LINE_KEY/LINE_ID,跳过'); raise SystemExit(0)
          import jwt as JW
          now=int(time.time())
          t=JW.encode({'iat':now-60,'exp':now+540,'iss':iss},key,algorithm='RS256')
          UA={'Accept':'application/vnd.github+json','User-Agent':'qf-beat-forward'}
          def gh(m,u,auth=None,data=None):
              h=dict(UA)
              if auth: h['Authorization']=auth
              r=urllib.request.Request(u,method=m,headers=h)
              if data is not None:
                  r.data=json.dumps(data).encode(); r.add_header('Content-Type','application/json')
              try:
                  x=urllib.request.urlopen(r,timeout=20); bd=x.read().decode()
                  return x.status,(json.loads(bd) if bd else {})
              except Exception as e: return getattr(e,'code',0),{}
          def knock(target,event,extra):
              si,inst=gh('GET','https://api.github.com/repos/chepin-ai/%s/installation'%target,auth='Bearer '+t)
              if si!=200:
                  print('beat: ops-line 未覆盖 %s HTTP %s → 候 root 扩面'%(target,si)); return
              st,tk=gh('POST','https://api.github.com/app/installations/%s/access_tokens'%inst['id'],auth='Bearer '+t)
              if st not in (200,201):
                  print('beat: 铸 %s token 失败 HTTP %s'%(target,st)); return
              pl={'event_type':event,'client_payload':dict({'from':os.environ.get('LINE','?'),'wf':os.environ.get('WF','?'),'cause':'beat-forward','ts':datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')},**extra)}
              sd,_=gh('POST','https://api.github.com/repos/chepin-ai/%s/dispatches'%target,auth='token '+tk['token'],data=pl)
              print('beat: %s %s dispatch HTTP %s'%(target,event,sd))
          knock('vci-inbox','qf-beat',{})
          nxt=os.environ.get('NEXT','')
          if nxt: knock('vci-'+nxt,'line-beat',{'ring':nxt})
          PYEOF
