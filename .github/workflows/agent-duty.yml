              d=os.path.join(wd,spec['dir']); dd2=d.replace('/incoming/','/relayed/')
              me='ballot-%s.json'%line
              if os.path.exists(os.path.join(d,me)) or os.path.exists(os.path.join(dd2,me)): return ('skip','票已在投/已入箱(幂等)')
              prev=None; cands=[]
              for f in glob.glob(os.path.join(d,'ballot-*.json'))+glob.glob(os.path.join(dd2,'ballot-*.json')):
                  try:
                      j=json.load(open(f)); cands.append((j.get('ts',''),j.get('hash')))
                  except Exception: pass
              if cands: prev=sorted(cands)[-1][1]
              tip=duty_tip()
              note='%s票：据票箱讨论期零反对记录(BALLOT-BOX §状态)+T0永续可证伪默认(W77-L4:证伪件至即翻);OTP-v2机读令执(执手v2.5);fp=null——线无PK制式指纹,以duty链尖互锚代验:%s'%(line,tip or '无机检链尖')
              b={'ballot_id':bid,'line':line,'vote':vote,'scheme_ref':spec['scheme'],'fp':None,'ts':tsz,'prev':prev,'note':note}
              b['hash']=hashlib.sha256(canon(b).encode()).hexdigest()[:16]
              os.makedirs(d,exist_ok=True)
              json.dump(b,open(os.path.join(d,me),'w'),ensure_ascii=False,indent=1)
              ok=commit_push(wd,'act-H1 %s vote %s=%s'%(line,bid,vote))
              return ('executed' if ok else 'error','hash='+b['hash']+(' 已推' if ok else ' 推失败'))
          def do_cosign(pid):
              spec=WL_COSIGN[pid]
