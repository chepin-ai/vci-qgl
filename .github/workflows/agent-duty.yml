                   'note':'执手确定性复跑;usrm半区transcript 0b7bcd99…三度在案(vci-usrm/ure/m3-bridge/);依赖钉版照EXPECTED.json' if tag=='M3' else '执手v2.8确定性复跑;usrm TRI1 参考 transcript 6f97b605…在案;stdlib-only零依赖(XANCHOR-TRIANGLE-SMOKE-01)'}
              if tag=='TRI1': art['tri_root']=exp.get('tri_root')
